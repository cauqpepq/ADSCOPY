appId: com.cauqpep.adspowerclone
productName: AdsPower Clone
copyright: Copyright © 2025 cauqpep
directories:
  output: release/${version}
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,eslint.config.js,.prettierignore,.prettierrc,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,package-lock.json,yarn.lock}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{tailwind.config.js,postcss.config.js}'
  - '!{.github,test,tests,docs,examples}/**'
asarUnpack:
  - resources/**
  - '**/*.{node,dll}'
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Network
  maintainer: cauqpep
  artifactName: ${productName}-${version}-${arch}.${ext}
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.utilities
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AdsPower Clone
  uninstallDisplayName: AdsPower Clone
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
publish: null
